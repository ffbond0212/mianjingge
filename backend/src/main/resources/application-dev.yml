# 本地开发：连宿主端口（Docker 映射 33061 / 63791）
# 所有敏感配置从环境变量读取（仓库根目录 cp .env.example .env）
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://localhost:33061/mianjingge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
    username: mianjingge
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: localhost
      port: 63791
      database: 0

mianjingge:
  jwt:
    secret: ${MJ_JWT_SECRET}
  admin:
    init-password: ${MJ_ADMIN_INIT_PASSWORD:}
