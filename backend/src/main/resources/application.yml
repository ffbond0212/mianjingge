spring:
  application:
    name: mianjingge-backend
  profiles:
    active: dev

mianjingge:
  jwt:
    # 无默认值：生产环境必须通过环境变量 MJ_JWT_SECRET 注入（见 .env.example）
    secret: ${MJ_JWT_SECRET}
    expire-days: 7
  admin:
    # 无默认值：生产环境必须通过环境变量 MJ_ADMIN_INIT_PASSWORD 注入，否则不预置账号
    init-password: ${MJ_ADMIN_INIT_PASSWORD:}

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  api-docs:
    enabled: true
