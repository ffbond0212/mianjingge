# 生产（docker compose 内部）：连容器服务名，敏感配置全部从环境变量注入（见 .env.example）
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://mysql:3306/mianjingge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
    username: mianjingge
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: redis
      port: 6379
      database: 0

mianjingge:
  jwt:
    secret: ${MJ_JWT_SECRET}
  admin:
    init-password: ${MJ_ADMIN_INIT_PASSWORD:}
